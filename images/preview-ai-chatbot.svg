<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">AI Support Chatbot — example local query and cited answer</title>
  <desc id="desc">A terminal-style illustration showing a natural-language IT support question answered from a local document with a page citation, and a note that the model runs on-device.</desc>
  <defs>
    <linearGradient id="ac-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151D2E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="640" height="400" rx="14" fill="url(#ac-bg)"/>
  <rect x="0.5" y="0.5" width="639" height="399" rx="13.5" fill="none" stroke="#94A3B8" stroke-opacity="0.16"/>

  <rect x="0" y="0" width="640" height="40" rx="14" fill="#0F172A"/>
  <rect x="0" y="26" width="640" height="14" fill="#0F172A"/>
  <line x1="0" y1="40" x2="640" y2="40" stroke="#94A3B8" stroke-opacity="0.14"/>
  <circle cx="24" cy="20" r="5.5" fill="#34D399"/>
  <circle cx="44" cy="20" r="5.5" fill="#FBBF24"/>
  <circle cx="64" cy="20" r="5.5" fill="#64748B"/>
  <text x="616" y="24" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748B">helpdesk-rag · local</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="28" y="82"><tspan fill="#34D399">&gt;</tspan><tspan fill="#F1F5F9"> How do I request a VPN access reset?</tspan></text>

    <rect x="24" y="106" width="592" height="140" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#94A3B8" stroke-opacity="0.14"/>
    <text x="44" y="136" fill="#F1F5F9">Submit a reset request through the helpdesk</text>
    <text x="44" y="160" fill="#F1F5F9">portal under Network Access. Access typically</text>
    <text x="44" y="184" fill="#F1F5F9">resumes within 15 minutes of approval.</text>
    <text x="44" y="216" fill="#64748B">source: IT-Onboarding.pdf, p.4 · chromadb match 0.91</text>

    <text x="28" y="286"><tspan fill="#34D399">●</tspan><tspan fill="#94A3B8"> Ollama · llama3.2 running locally</tspan></text>
    <text x="28" y="312" fill="#64748B">// no document text or query ever leaves this machine</text>
  </g>
</svg>
