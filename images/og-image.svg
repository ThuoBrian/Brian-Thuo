<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Brian Gachau Thuo — Rust Systems Engineer, IT Ops, Nairobi</title>
  <desc id="desc">Social preview card for Brian Gachau Thuo's portfolio.</desc>
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="82%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="og-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-grid)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- mark -->
  <rect x="80" y="72" width="56" height="56" rx="13" fill="#070B14" stroke="#34D399" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="108" y="110" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="22" fill="#F1F5F9">BT<tspan fill="#34D399">.</tspan></text>

  <text x="80" y="252" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="64" fill="#F1F5F9">Brian Gachau Thuo</text>

  <text x="80" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#34D399">Rust Systems Engineer · IT Ops · Nairobi</text>

  <text x="80" y="356" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#94A3B8">
    <tspan x="80" dy="0">I build reliable backend systems and local AI</tspan>
    <tspan x="80" dy="36">tooling for teams in East Africa.</tspan>
  </text>

  <line x1="80" y1="486" x2="1120" y2="486" stroke="#94A3B8" stroke-opacity="0.14"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64748B">
    <text x="80" y="530">Rust</text>
    <text x="160" y="530">Python</text>
    <text x="260" y="530">Go</text>
    <text x="310" y="530">FastAPI</text>
