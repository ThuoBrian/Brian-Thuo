  <text x="1120" y="530" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18"><tspan fill="#34D399">●</tspan><tspan fill="#94A3B8"> thuobrian.github.io/Brian-Thuo</tspan></text>
