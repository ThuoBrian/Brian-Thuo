<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Laptop Inventory API — example request and response</title>
  <desc id="desc">A terminal-style illustration showing a POST request to assign a laptop and the JSON response with an atomic transaction confirmation.</desc>
  <defs>
    <linearGradient id="li-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151D2E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="640" height="400" rx="14" fill="url(#li-bg)"/>
  <rect x="0.5" y="0.5" width="639" height="399" rx="13.5" fill="none" stroke="#94A3B8" stroke-opacity="0.16"/>

  <rect x="0" y="0" width="640" height="40" rx="14" fill="#0F172A"/>
  <rect x="0" y="26" width="640" height="14" fill="#0F172A"/>
  <line x1="0" y1="40" x2="640" y2="40" stroke="#94A3B8" stroke-opacity="0.14"/>
  <circle cx="24" cy="20" r="5.5" fill="#34D399"/>
  <circle cx="44" cy="20" r="5.5" fill="#FBBF24"/>
  <circle cx="64" cy="20" r="5.5" fill="#64748B"/>
  <text x="616" y="24" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748B">laptop-inventory · actix-web</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="28" y="80"><tspan fill="#34D399">$</tspan><tspan fill="#F1F5F9"> curl -X POST /api/laptops/42/assign \</tspan></text>
    <text x="28" y="106" fill="#94A3B8">    -d '{"user_id": 7}'</text>

    <text x="28" y="150" fill="#F1F5F9">{</text>
    <text x="48" y="176"><tspan fill="#FBBF24">"laptop_id"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#F1F5F9">42,</tspan></text>
    <text x="48" y="202"><tspan fill="#FBBF24">"status"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#34D399">"assigned"</tspan><tspan fill="#F1F5F9">,</tspan></text>
    <text x="48" y="228"><tspan fill="#FBBF24">"assigned_to"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#F1F5F9">"jane.doe",</tspan></text>
    <text x="48" y="254"><tspan fill="#FBBF24">"tx"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#34D399">"atomic ok"</tspan></text>
    <text x="28" y="280" fill="#F1F5F9">}</text>

    <text x="28" y="326" fill="#64748B">// unassigning a user cascades: laptop status</text>
    <text x="28" y="348" fill="#64748B">// reverts to "available" in the same transaction</text>
  </g>
</svg>
